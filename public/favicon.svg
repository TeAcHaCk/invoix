<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Subtle glow layer -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Invoix Checkmark & "X" Monogram -->
  <g transform="translate(48, 48)">
    <!-- Diagonal 1 (Gold Stream) -->
    <rect x="76" y="280" width="280" height="52" rx="26" transform="rotate(-45 76 280)" fill="url(#primaryGrad)" />
    
    <!-- Diagonal 2 (Split & Emerald Checkmark overlay) -->
    <rect x="274" y="82" width="130" height="52" rx="26" transform="rotate(45 274 82)" fill="url(#primaryGrad)" />
    <path d="M96 230 L168 302 L320 150" fill="none" stroke="url(#accentGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>